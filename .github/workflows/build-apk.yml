name: Build debug APK

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Выпустить релиз v<versionName> с этим APK"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lesovod-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Релиз: либо тег vX.Y.Z, либо ручной запуск с галочкой release (тогда тег
      # v<versionName> создаётся сам на этом коммите). Приложение (AppUpdateManager)
      # берёт releases/latest и сравнивает тег с versionName — так рабочим приходит обновление.
      - name: Resolve release tag
        id: rel
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Тег ${GITHUB_REF_NAME} не совпадает с versionName $version" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.tag }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
