name: Build Kubaturnik APK

# «Лесовод Кубатурник» — отдельное приложение (модуль :kubaturnik), выпускается независимо
# от Лесовода. Релизы — с тегом kubaturnik-vX.Y.Z и НЕ помечаются «latest», чтобы
# автообновление основного Лесовода (оно читает releases/latest) их не подхватило.

on:
  push:
    paths:
      - "kubaturnik/**"
      - ".github/workflows/build-kubaturnik.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
  workflow_dispatch:
    inputs:
      release:
        description: "Выпустить релиз kubaturnik-v<versionName> с этим APK"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :kubaturnik:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :kubaturnik:assembleDebug --no-daemon

      - name: Name APK
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' kubaturnik/build.gradle.kts)
          out="kubaturnik/build/outputs/apk/debug/lesovod-kubaturnik-$version.apk"
          cp kubaturnik/build/outputs/apk/debug/kubaturnik-debug.apk "$out"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lesovod-kubaturnik-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kubaturnik-v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Лесовод Кубатурник ${{ steps.apk.outputs.version }}
          make_latest: "false"
          files: ${{ steps.apk.outputs.path }}
          body: |
            Отдельное приложение «Лесовод Кубатурник» — кубатурник по ГОСТ 2708-75 с голосовым вводом.
            Работает без интернета и без входа. Сорта фиксированные: А, Б, С, Д.
            Голосовая модель (~45 МБ) скачивается один раз в самом приложении (кнопка микрофона).
